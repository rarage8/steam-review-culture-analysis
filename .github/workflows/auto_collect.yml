name: Refresh Steam dashboard data

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Refresh dashboard data
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python src/refresh_dashboard_data.py --detect-new --auto-add
      - name: Commit refreshed data
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add src/games_list.py web/data/games.json data/player_counts/current_players.csv new_games_detected.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore(data): refresh dashboard assets"
            git push
          fi
