<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steam Review Culture Dashboard</title>
  <script>
    (function () {
      var theme = localStorage.getItem('steam-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <strong>Steam Review Culture Dashboard</strong>
        <span id="topbarSub"></span>
      </div>
      <div class="topbar-actions">
        <select id="uiLangSel" class="lang-select">
          <option value="japanese">日本語</option>
          <option value="english">English</option>
          <option value="schinese">简体中文</option>
          <option value="russian">Русский</option>
          <option value="german">Deutsch</option>
          <option value="koreana">한국어</option>
        </select>
        <button id="themeBtn" class="theme-btn" type="button">◐</button>
      </div>
    </header>
    <aside class="sidebar">
      <div class="nav-label" id="navLabel"></div>
      <div class="nav-list">
        <button class="nav-btn active" data-page="reviews" id="navReviews"></button>
        <button class="nav-btn" data-page="population" id="navPopulation"></button>
      </div>
    </aside>
    <main class="main">
      <section class="page active" id="pageReviews">
        <div class="page-head"><div><h1 id="reviewsHd"></h1><p id="reviewsSub"></p></div><div class="pill-note" id="generatedNote"></div></div>
        <div class="section"><h2 id="reviewsGameHd"></h2><p class="section-sub" id="reviewsGameSub"></p><div class="selector-row" id="reviewGameSelector"></div></div>
        <div class="section"><h2 id="reviewCardsHd"></h2><p class="section-sub" id="reviewCardsSub"></p><div class="lang-grid" id="langGrid"></div></div>
        <div class="section review-panel" id="reviewPanel"><h2 id="reviewPanelHd"></h2><p class="section-sub" id="reviewPanelSub"></p><div class="review-columns"><div class="review-column positive"><h3 id="positiveHd"></h3><div id="positiveReviews"></div></div><div class="review-column neutral"><h3 id="neutralHd"></h3><div id="neutralReviews"></div></div><div class="review-column negative"><h3 id="negativeHd"></h3><div id="negativeReviews"></div></div></div></div>
        <div class="section"><h2 id="timingHd"></h2><p class="section-sub" id="timingSub"></p><div class="timing-grid"><div class="chart-wrap"><canvas id="timingChart"></canvas></div><div class="stat-list" id="timingStats"></div></div><p class="footnote" id="timingNote"></p></div>
      </section>
      <section class="page" id="pagePopulation">
        <div class="page-head"><div><h1 id="populationHd"></h1><p id="populationSub"></p></div></div>
        <div class="section"><h2 id="populationPeriodHd"></h2><p class="section-sub" id="populationPeriodSub"></p><div class="chart-toolbar" id="periodSelector"></div><div class="selector-row" id="populationGameSelector"></div><div class="chart-wrap"><canvas id="populationChart"></canvas></div><p class="footnote" id="populationNote"></p></div>
      </section>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
