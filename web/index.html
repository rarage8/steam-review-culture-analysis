<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steam Review Culture Dashboard</title>
  <!-- Prevent flash of wrong theme -->
  <script>
    (function() {
      var t = localStorage.getItem('steam-theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <!-- Chart.js for population page -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* ─── CSS Variables ───────────────────────────────────── */
    :root {
      --bg:        #0f1117;
      --surface:   #161b2e;
      --surface2:  #1c2030;
      --border:    #2a3047;
      --text:      #e8eaf0;
      --text2:     #9aa3b8;
      --text3:     #7a8499;
      --accent:    #4a6cf7;
      --sidebar-w: 220px;
      --topbar-h:  56px;
    }
    [data-theme="light"] {
      --bg:       #f0f2f8;
      --surface:  #ffffff;
      --surface2: #e8edf8;
      --border:   #c8d0e8;
      --text:     #1a1f35;
      --text2:    #4a5275;
      --text3:    #8090b0;
      --accent:   #3d5fe0;
    }

    /* ─── Reset & Base ────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }

    /* ─── App Layout ──────────────────────────────────────── */
    .app {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      grid-template-rows: var(--topbar-h) 1fr;
      min-height: 100vh;
    }

    /* ─── Topbar ──────────────────────────────────────────── */
    .topbar {
      grid-column: 1 / -1;
      grid-row: 1;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px 0 0;
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 0;
    }
    .topbar-logo {
      width: var(--sidebar-w);
      padding: 0 16px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--accent);
      flex-shrink: 0;
      white-space: nowrap;
    }
    .topbar-title {
      flex: 1;
      font-size: 0.85rem;
      color: var(--text3);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .menu-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text2);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 8px;
      line-height: 1;
      transition: background 0.15s;
    }
    .menu-toggle:hover { background: var(--surface2); }

    /* ─── Language Select ─────────────────────────────────── */
    .lang-select {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s;
    }
    .lang-select:hover { border-color: var(--accent); }

    /* ─── Theme Toggle ────────────────────────────────────── */
    .theme-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }
    .theme-btn:hover { background: var(--border); }

    /* ─── Sidebar ─────────────────────────────────────────── */
    .sidebar {
      grid-column: 1;
      grid-row: 2;
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 16px 10px;
      position: sticky;
      top: var(--topbar-h);
      height: calc(100vh - var(--topbar-h));
      overflow-y: auto;
    }
    .nav-label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text3);
      padding: 6px 10px 4px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: none;
      background: none;
      color: var(--text2);
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s, color 0.15s;
    }
    .nav-item:hover { background: var(--surface2); color: var(--text); }
    .nav-item.active { background: var(--accent); color: #fff; }
    .nav-icon { font-size: 1rem; }

    /* ─── Sidebar backdrop (mobile) ───────────────────────── */
    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 150;
    }
    .sidebar-backdrop.open { display: block; }

    /* ─── Main ────────────────────────────────────────────── */
    .main {
      grid-column: 2;
      grid-row: 2;
      padding: 32px 28px 64px;
      overflow-y: auto;
      min-width: 0;
    }

    /* ─── Pages ───────────────────────────────────────────── */
    .page { display: none; }
    .page.active { display: block; animation: fadeUp 0.2s ease; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── Page header ─────────────────────────────────────── */
    .page-hd { margin-bottom: 28px; }
    .page-hd h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
    .page-hd p  { font-size: 0.88rem; color: var(--text3); }

    /* ─── Game selector ───────────────────────────────────── */
    .game-selector {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 28px;
    }
    .game-btn {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      color: var(--text2);
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 0.84rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.16s;
    }
    .game-btn:hover { border-color: var(--accent); color: var(--text); }
    .game-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

    /* ─── Cards grid ──────────────────────────────────────── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      max-width: 860px;
      margin: 0 auto 28px;
    }
    @media (max-width: 560px) {
      .cards-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* ─── Language card ───────────────────────────────────── */
    .lang-card {
      border-radius: 18px;
      padding: 20px 18px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      position: relative;
      overflow: hidden;
      border: 2px solid transparent;
      user-select: none;
    }
    .lang-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.07);
      border-radius: inherit;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .lang-card:hover { transform: translateY(-3px); }
    .lang-card:hover::before { opacity: 1; }
    .lang-card.selected {
      border-color: rgba(255,255,255,0.55);
      transform: translateY(-3px);
      box-shadow: 0 0 0 4px rgba(255,255,255,0.12);
    }
    .lang-card .flag   { font-size: 1.9rem; line-height: 1; margin-bottom: 8px; }
    .lang-card .name   { font-size: 0.92rem; font-weight: 600; color: rgba(255,255,255,0.92); margin-bottom: 10px; }
    .lang-card .rate   { font-size: 1.9rem; font-weight: 800; color: #fff; letter-spacing: -1px; line-height: 1; margin-bottom: 5px; }
    .lang-card .counts { font-size: 0.76rem; color: rgba(255,255,255,0.65); display: flex; gap: 8px; }
    .count-pos { color: rgba(160,230,200,0.9); }
    .count-neg { color: rgba(255,180,160,0.9); }
    .lang-card .hint   { position: absolute; bottom: 8px; right: 12px; font-size: 0.68rem; color: rgba(255,255,255,0.38); }

    /* ─── Review panel ────────────────────────────────────── */
    .review-panel {
      max-width: 860px;
      margin: 0 auto;
      background: var(--surface);
      border-radius: 20px;
      border: 1.5px solid var(--border);
      overflow: hidden;
      display: none;
    }
    .review-panel.visible { display: block; animation: fadeUp 0.2s ease; }

    .panel-header {
      padding: 16px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .panel-header .flag { font-size: 1.3rem; }
    .panel-header h2    { font-size: 0.95rem; font-weight: 600; color: var(--text); }
    .panel-close {
      margin-left: auto;
      background: none;
      border: none;
      color: var(--text3);
      font-size: 1.3rem;
      cursor: pointer;
      line-height: 1;
      padding: 2px 8px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .panel-close:hover { background: var(--surface2); color: var(--text); }

    .panel-columns { display: grid; grid-template-columns: 1fr 1fr; }
    @media (max-width: 560px) { .panel-columns { grid-template-columns: 1fr; } }

    .col-pos, .col-neg { padding: 18px; max-height: 460px; overflow-y: auto; }
    .col-pos { border-right: 1px solid var(--border); }

    .col-heading {
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    .col-pos .col-heading { color: #4ade80; }
    .col-neg .col-heading { color: #f87171; }

    .review-item {
      background: var(--surface2);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 9px;
      font-size: 0.84rem;
      line-height: 1.6;
      color: var(--text2);
      border-left: 3px solid transparent;
    }
    .col-pos .review-item { border-left-color: #4ade8055; }
    .col-neg .review-item { border-left-color: #f8717155; }

    .no-reviews { color: var(--text3); font-size: 0.84rem; text-align: center; padding: 28px 0; }

    .col-pos::-webkit-scrollbar, .col-neg::-webkit-scrollbar { width: 4px; }
    .col-pos::-webkit-scrollbar-thumb, .col-neg::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ─── Population page ─────────────────────────────────── */
    .chart-card {
      background: var(--surface);
      border-radius: 20px;
      border: 1.5px solid var(--border);
      padding: 28px 24px 20px;
      max-width: 860px;
      margin: 0 auto;
    }
    .chart-canvas-wrap { position: relative; height: 320px; }
    .chart-note {
      font-size: 0.76rem;
      color: var(--text3);
      margin-top: 14px;
      text-align: center;
      line-height: 1.5;
    }

    /* ─── Mobile responsive ───────────────────────────────── */
    @media (max-width: 768px) {
      .app { grid-template-columns: 1fr; }
      .topbar-logo { display: none; }
      .menu-toggle { display: flex; }
      .sidebar {
        position: fixed;
        left: calc(-1 * var(--sidebar-w) - 10px);
        top: var(--topbar-h);
        height: calc(100vh - var(--topbar-h));
        width: var(--sidebar-w);
        z-index: 200;
        transition: left 0.25s ease;
        box-shadow: 4px 0 24px rgba(0,0,0,0.3);
      }
      .sidebar.open { left: 0; }
      .main { grid-column: 1; padding: 20px 16px 48px; }
    }
  </style>
</head>
<body>

<div class="app">

  <!-- ── Topbar ─────────────────────────────────────────── -->
  <header class="topbar">
    <button class="menu-toggle" id="menuToggle">☰</button>
    <div class="topbar-logo">Steam Analytics</div>
    <span class="topbar-title" id="topbarSub"></span>
    <div class="topbar-actions">
      <select class="lang-select" id="uiLangSel">
        <option value="japanese">日本語</option>
        <option value="english">English</option>
        <option value="schinese">中文（简体）</option>
        <option value="russian">Русский</option>
        <option value="german">Deutsch</option>
        <option value="koreana">한국어</option>
      </select>
      <button class="theme-btn" id="themeBtn" title="Toggle theme">☀️</button>
    </div>
  </header>

  <!-- ── Sidebar backdrop ───────────────────────────────── -->
  <div class="sidebar-backdrop" id="sidebarBg"></div>

  <!-- ── Sidebar ────────────────────────────────────────── -->
  <nav class="sidebar" id="sidebar">
    <div class="nav-label" id="navLabel"></div>
    <button class="nav-item active" data-page="reviews" id="navReviews">
      <span class="nav-icon">🌐</span>
      <span id="navReviewsTxt"></span>
    </button>
    <button class="nav-item" data-page="population" id="navPop">
      <span class="nav-icon">📊</span>
      <span id="navPopTxt"></span>
    </button>
  </nav>

  <!-- ── Main ───────────────────────────────────────────── -->
  <main class="main">

    <!-- ── Reviews page ─────────────────────────────────── -->
    <div class="page active" id="pageReviews">
      <div class="page-hd">
        <h2 id="reviewsHd"></h2>
        <p  id="reviewsSub"></p>
      </div>
      <div class="game-selector" id="gameSelReviews"></div>
      <div class="cards-grid"    id="cardsGrid"></div>
      <div class="review-panel"  id="reviewPanel">
        <div class="panel-header">
          <span class="flag" id="panelFlag"></span>
          <h2 id="panelTitle"></h2>
          <button class="panel-close" id="panelClose">×</button>
        </div>
        <div class="panel-columns">
          <div class="col-pos">
            <div class="col-heading" id="colPosHd"></div>
            <div id="posReviews"></div>
          </div>
          <div class="col-neg">
            <div class="col-heading" id="colNegHd"></div>
            <div id="negReviews"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ── Population page ──────────────────────────────── -->
    <div class="page" id="pagePopulation">
      <div class="page-hd">
        <h2 id="popHd"></h2>
        <p  id="popSub"></p>
      </div>
      <div class="game-selector" id="gameSelPop"></div>
      <div class="chart-card">
        <div class="chart-canvas-wrap">
          <canvas id="popChart"></canvas>
        </div>
        <p class="chart-note" id="chartNote"></p>
      </div>
    </div>

  </main>
</div><!-- .app -->

  russian: {
    flag: "🇷🇺",
    label: { japanese:"ロシア・東欧", english:"Russia / E.Europe", schinese:"俄罗斯", russian:"Россия", german:"Russland", koreana:"러시아" }
  },
  german: {
    flag: "🇩🇪",
    label: { japanese:"ドイツ・欧州", english:"Germany / Europe", schinese:"德国/欧洲", russian:"Германия", german:"Deutschland", koreana:"독일/유럽" }
  },
  koreana: {
    flag: "🇰🇷",
    label: { japanese:"韓国", english:"Korea", schinese:"韩国", russian:"Корея", german:"Korea", koreana:"한국" }
  },
};

const HTML_LANG = { japanese:'ja', english:'en', schinese:'zh-CN', russian:'ru', german:'de', koreana:'ko' };

// ─── App state ────────────────────────────────────────────────────────────
let data        = null;
let uiLang      = 'japanese';
let theme       = 'dark';
let currentPage = 'reviews';
let currentGame = null;
let selectedLang = null;
let popChart    = null;

// ─── Helpers ──────────────────────────────────────────────────────────────
const t = key => (I18N[uiLang] || I18N.japanese)[key] || key;

function rateToColor(rate) {
  const hue = rate < 0.5
    ? rate * 2 * 25
    : 25 + (rate - 0.5) * 2 * 190;
  const sat   = 65 + rate * 15;
  const light = 28 + rate * 10;
  return `hsl(${hue.toFixed(0)},${sat.toFixed(0)}%,${light.toFixed(0)}%)`;
}

// ─── Theme ────────────────────────────────────────────────────────────────
function applyTheme(val) {
  theme = val;
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeBtn').textContent = theme === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('steam-theme', theme);
  if (popChart && currentGame) renderPopChart(currentGame);
}

document.getElementById('themeBtn').addEventListener('click', () => {
  applyTheme(theme === 'dark' ? 'light' : 'dark');
});

// ─── UI Language ──────────────────────────────────────────────────────────
function applyUiLang(lang) {
  uiLang = lang;
  document.documentElement.lang = HTML_LANG[lang] || 'ja';
  localStorage.setItem('steam-lang', lang);
  refreshI18n();
}

function refreshI18n() {
  document.getElementById('topbarSub').textContent    = t('topbar_sub');
  document.getElementById('navLabel').textContent     = t('nav_label');
  document.getElementById('navReviewsTxt').textContent = t('nav_reviews');
  document.getElementById('navPopTxt').textContent    = t('nav_pop');
  document.getElementById('reviewsHd').textContent    = t('reviews_hd');
  document.getElementById('reviewsSub').textContent   = t('reviews_sub');
  document.getElementById('popHd').textContent        = t('pop_hd');
  document.getElementById('popSub').textContent       = t('pop_sub');
  document.getElementById('chartNote').textContent    = t('pop_note');
  document.getElementById('colPosHd').textContent     = `▲ ${t('positive')}`;
  document.getElementById('colNegHd').textContent     = `▼ ${t('negative')}`;

  if (!data) return;

  // Re-render cards with new language labels
  if (currentGame) renderCards(currentGame);

  // Re-render open review panel
  if (selectedLang && currentGame) {
    const langInfo = LANGS[selectedLang];
    const game = data.games.find(g => g.id === currentGame);
    document.getElementById('panelTitle').textContent =
      `${langInfo.label[uiLang]} — ${game.title}`;
    renderReviews('posReviews', getReviews(currentGame, selectedLang, 'positive'));
    renderReviews('negReviews', getReviews(currentGame, selectedLang, 'negative'));
  }

  // Re-render chart with updated labels
  if (popChart && currentGame) renderPopChart(currentGame);
}

document.getElementById('uiLangSel').addEventListener('change', e => {
  applyUiLang(e.target.value);
});

// ─── Navigation ───────────────────────────────────────────────────────────
function navigateTo(page) {
  currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(page === 'reviews' ? 'pageReviews' : 'pagePopulation')
    .classList.add('active');
  document.querySelectorAll('.nav-item').forEach(b => {
    b.classList.toggle('active', b.dataset.page === page);
  });
  closeSidebar();
}

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => navigateTo(btn.dataset.page));
});

// ─── Mobile sidebar ───────────────────────────────────────────────────────
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBg').classList.remove('open');
}
document.getElementById('menuToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarBg').classList.toggle('open');
});
document.getElementById('sidebarBg').addEventListener('click', closeSidebar);

// ─── Game selector ────────────────────────────────────────────────────────
function buildGameSelector(containerId, onSelect) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  data.games.forEach(g => {
    const btn = document.createElement('button');
    btn.className = 'game-btn';
    btn.textContent = g.title;
    btn.dataset.id = g.id;
    btn.addEventListener('click', () => onSelect(g.id));
    el.appendChild(btn);
  });
}

function setActiveGameBtn(containerId, gameId) {
  document.querySelectorAll(`#${containerId} .game-btn`).forEach(b => {
    b.classList.toggle('active', b.dataset.id === gameId);
  });
}

function selectGame(gameId) {
  currentGame  = gameId;
  selectedLang = null;
  setActiveGameBtn('gameSelReviews', gameId);
  setActiveGameBtn('gameSelPop', gameId);
  renderCards(gameId);
  closePanel();
}

function selectGamePop(gameId) {
  currentGame = gameId;
  setActiveGameBtn('gameSelReviews', gameId);
  setActiveGameBtn('gameSelPop', gameId);
  renderPopChart(gameId);
}

// ─── Cards ────────────────────────────────────────────────────────────────
function renderCards(gameId) {
  const grid = document.getElementById('cardsGrid');
  grid.innerHTML = '';
  const gameData = data.reviews[gameId];
  if (!gameData) return;

  Object.entries(LANGS).forEach(([langKey, langInfo]) => {
    const d = gameData[langKey];
    if (!d) return;
    const rate = d.approval_rate;
    const pct  = Math.round(rate * 100);
    const card = document.createElement('div');
    card.className = 'lang-card' + (langKey === selectedLang ? ' selected' : '');
    card.dataset.lang  = langKey;
    card.style.background = rateToColor(rate);
    card.innerHTML = `
      <div class="flag">${langInfo.flag}</div>
      <div class="name">${langInfo.label[uiLang]}</div>
      <div class="rate">${pct}%</div>
      <div class="counts">
        <span class="count-pos">▲ ${d.pos_count}</span>
        <span class="count-neg">▼ ${d.neg_count}</span>
      </div>
      <div class="hint">${t('click_hint')}</div>
    `;
    card.addEventListener('click', () => openPanel(gameId, langKey));
    grid.appendChild(card);
  });
}

// ─── Review display logic ─────────────────────────────────────────────────
// If UI language matches the card's source language → show original text.
// Otherwise → show English translation (positive / negative).
function getReviews(gameId, langKey, polarity) {
  const d = data.reviews[gameId][langKey];
  if (!d) return [];
  const origKey = `${polarity}_orig`;
  if (uiLang === langKey && d[origKey] && d[origKey].length > 0) {
    return d[origKey];
  }
  return d[polarity] || [];
}

// ─── Review panel ─────────────────────────────────────────────────────────
function openPanel(gameId, langKey) {
  selectedLang = langKey;
  document.querySelectorAll('.lang-card').forEach(c => {
    c.classList.toggle('selected', c.dataset.lang === langKey);
  });
  const langInfo = LANGS[langKey];
  const game = data.games.find(g => g.id === gameId);
  document.getElementById('panelFlag').textContent  = langInfo.flag;
  document.getElementById('panelTitle').textContent = `${langInfo.label[uiLang]} — ${game.title}`;
  renderReviews('posReviews', getReviews(gameId, langKey, 'positive'));
  renderReviews('negReviews', getReviews(gameId, langKey, 'negative'));
  const panel = document.getElementById('reviewPanel');
  panel.classList.add('visible');
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function closePanel() {
  document.getElementById('reviewPanel').classList.remove('visible');
  document.querySelectorAll('.lang-card').forEach(c => c.classList.remove('selected'));
  selectedLang = null;
}

document.getElementById('panelClose').addEventListener('click', closePanel);

function renderReviews(containerId, reviews) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  if (!reviews || reviews.length === 0) {
    el.innerHTML = `<div class="no-reviews">${t('no_reviews')}</div>`;
    return;
  }
  reviews.forEach(text => {
    const item = document.createElement('div');
    item.className = 'review-item';
    item.textContent = text;
    el.appendChild(item);
  });
}

// ─── Population chart ──────────────────────────────────────────────────────
function renderPopChart(gameId) {
  const gameData = data.reviews[gameId];
  const langKeys = Object.keys(LANGS);
  const labels   = langKeys.map(k => `${LANGS[k].flag} ${LANGS[k].label[uiLang]}`);
  const posData  = langKeys.map(k => gameData[k]?.pos_count || 0);
  const negData  = langKeys.map(k => gameData[k]?.neg_count || 0);

  const isDark    = theme === 'dark';
  const textClr   = isDark ? '#9aa3b8' : '#4a5275';
  const gridClr   = isDark ? '#2a3047' : '#c8d0e8';
  const surfaceClr = isDark ? '#1c2030' : '#e8edf8';

  const ctx = document.getElementById('popChart').getContext('2d');
  if (popChart) popChart.destroy();

  popChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {
          label: t('chart_pos'),
          data: posData,
          backgroundColor: 'rgba(74,222,128,0.7)',
          borderColor: 'rgba(74,222,128,0.9)',
          borderWidth: 1,
          borderRadius: 6,
        },
        {
          label: t('chart_neg'),
          data: negData,
          backgroundColor: 'rgba(248,113,113,0.7)',
          borderColor: 'rgba(248,113,113,0.9)',
          borderWidth: 1,
          borderRadius: 6,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          labels: { color: textClr, padding: 16 }
        },
        tooltip: {
          backgroundColor: surfaceClr,
          titleColor: textClr,
          bodyColor: textClr,
          borderColor: gridClr,
          borderWidth: 1,
          callbacks: {
            footer: items => `${t('chart_total')}: ${items.reduce((s,i) => s + i.raw, 0)}`
          }
        }
      },
      scales: {
        x: {
          ticks: { color: textClr, font: { size: 12 } },
          grid:  { color: gridClr }
        },
        y: {
          ticks: { color: textClr },
          grid:  { color: gridClr },
          beginAtZero: true,
        }
      }
    }
  });
}

// ─── Initialisation ────────────────────────────────────────────────────────
// Restore preferences
const savedTheme = localStorage.getItem('steam-theme');
const savedLang  = localStorage.getItem('steam-lang');

if (savedTheme) { theme = savedTheme; }
// Theme already applied via inline script in <head>; just sync button icon.
document.getElementById('themeBtn').textContent = theme === 'dark' ? '☀️' : '🌙';

if (savedLang && I18N[savedLang]) {
  uiLang = savedLang;
  document.getElementById('uiLangSel').value = savedLang;
  document.documentElement.lang = HTML_LANG[savedLang] || 'ja';
}

// Apply static i18n strings before data loads
refreshI18n();

// Fetch data (change 'data/mock.json' → 'data/games.json' after running export_web_data.py)
fetch('data/mock.json')
  .then(r => r.json())
  .then(json => {
    data = json;
    buildGameSelector('gameSelReviews', selectGame);
    buildGameSelector('gameSelPop', selectGamePop);
    selectGame(data.games[0].id);
    renderPopChart(data.games[0].id);
  })
  .catch(err => {
    document.querySelector('.main').insertAdjacentHTML(
      'afterbegin',
      `<p style="color:#f87171;text-align:center;padding:20px">${t('load_err')}: ${err}</p>`
    );
  });
</script>
</body>
</html>
